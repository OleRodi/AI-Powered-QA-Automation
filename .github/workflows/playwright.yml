name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run on demand
        type: choice
        default: regression
        options:
          - regression
          - smoke
          - sanity
          - api
          - e2e

jobs:
  test:
    name: Run Playwright tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: dev1
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Trigger → suite:
      #   pull_request     → smoke
      #   push             → sanity
      #   workflow_dispatch → regression (or the chosen input)
      - name: Select test suite
        id: suite
        run: |
          case "${{ github.event_name }}" in
            pull_request)     suite=smoke ;;
            push)             suite=sanity ;;
            workflow_dispatch) suite="${{ inputs.suite }}" ;;
            *)                suite=regression ;;
          esac
          echo "name=${suite}" >> "$GITHUB_OUTPUT"
          echo "script=test:${suite}" >> "$GITHUB_OUTPUT"
          echo "Selected suite: ${suite} (npm run test:${suite})"

      - name: Run Playwright tests (${{ steps.suite.outputs.script }})
        run: npm run ${{ steps.suite.outputs.script }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ steps.suite.outputs.name }}
          path: playwright-report/
          retention-days: 30
